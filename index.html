<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="manifest" href="manifest.webmanifest">
<title>Armonia Thassos</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#2563eb; --in:#059669; --out:#dc2626; --warn:#d97706;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --header-h: 58px;
    --nav-h: 58px;
    --nav-total: calc(var(--nav-h) + var(--safe-b));
    --dock-h: 0px;
    --fab-size: 44px;
    --side-gutter: max(12px, calc((100vw - 1180px) / 2 + 12px));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    overscroll-behavior-x:none}
  /* iOS Safari zooms inputs under 16px — keep all editable fields at 16px */
  input,select,textarea,.qty-field,.cart-qty-input,.pin-input,input[type="date"],input[type="number"],input[type="text"],input[type="email"],input[type="search"],input[type="tel"]{
    font-size:16px!important}
  /* Boot: only the login gate — no app chrome flash */
  html:has(body.auth-pending), body.auth-pending{
    background:#071a2b!important; color:#fff;
  }
  body.auth-pending > *:not(#gate):not(#toast){display:none!important}
  body.auth-pending #gate{display:block!important}
  body.auth-pending #toast{display:block!important;z-index:90;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  body.auth-pending #app[hidden]{display:none!important}
  body.auth-pending #gate::before,
  body.auth-pending #gate::after{content:none!important;display:none!important;animation:none!important}
  #app{max-width:1180px; margin:0 auto; min-height:100vh; padding-bottom:calc(var(--nav-total) + var(--dock-h) + 20px)}
  header{position:sticky; top:0; z-index:20; background:#0f172a; color:#fff;
    padding:13px 14px 11px; display:flex; align-items:center; gap:10px; min-height:var(--header-h)}
  header h1{font-size:16.5px; margin:0; font-weight:650; letter-spacing:-.01em}
  header .who{font-size:11.5px; opacity:.75}
  main{padding:13px 13px 20px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:11px}
  .card h2{font-size:13.5px; margin:0 0 9px; font-weight:650}
  .row{display:flex; gap:8px; align-items:center}
  .row.between{justify-content:space-between}
  .grow{flex:1; min-width:0}
  .muted{color:var(--muted); font-size:12.5px}
  .strong{font-weight:650}
  .truncate{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  button,input,select,textarea{font:inherit; color:inherit}
  input,select,textarea{width:100%; padding:10px 11px; border:1px solid var(--line);
    border-radius:10px; background:#fff; outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  label.f{display:block; margin-bottom:10px}
  label.f > span{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .btn{border:0; border-radius:11px; padding:11px 13px; font-weight:600; background:var(--brand);
    color:#fff; cursor:pointer; width:100%}
  .btn.sec{background:#e8edf5; color:#0f172a}
  .btn.ghost{background:transparent; color:var(--brand); padding:7px 4px; width:auto; font-size:13px}
  .btn.sm{padding:7px 11px; width:auto; font-size:12.5px; border-radius:9px}
  .btn.in{background:var(--in)} .btn.out{background:var(--out)}
  .btn:disabled{opacity:.45}
  .lang{background:#1e293b; color:#fff; border:1px solid #334155; border-radius:9px;
    padding:6px 9px; font-size:11.5px; font-weight:650; cursor:pointer; flex:0 0 auto}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 11px;
    font-size:13px; cursor:pointer; display:inline-flex; gap:5px; align-items:center}
  .chip.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .pill{display:inline-block; font-size:11px; padding:3px 8px; border-radius:999px; font-weight:650}
  .pill.ovr{background:#fef3c7; color:#92400e}
  .pill.in{background:#d1fae5; color:#065f46}
  .pill.out{background:#fee2e2; color:#991b1b}
  .pill.gray{background:#eef2f6; color:#475569}
  .pill.kid{background:#e0f2fe; color:#075985}
  .pill.open{background:#fee2e2; color:#991b1b}
  nav{position:fixed; left:0; right:0; bottom:0; z-index:50; background:#fff; border-top:1px solid var(--line);
    display:flex; min-height:var(--nav-h); padding-bottom:var(--safe-b); max-width:1180px; margin:0 auto;
    box-shadow:0 -4px 18px rgba(15,23,42,.06)}
  nav button{flex:1; border:0; background:none; padding:8px 2px 7px; color:var(--muted);
    font-size:10.5px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer;
    min-height:var(--nav-h); touch-action:manipulation}
  nav button .i{font-size:19px; line-height:1}
  nav button.on{color:var(--brand); font-weight:650}
  .days{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto; width:46px; text-align:center; padding:7px 0; border-radius:11px;
    border:1px solid var(--line); background:#fff; cursor:pointer}
  .day .d{font-size:10.5px; color:var(--muted)} .day .n{font-size:16px; font-weight:650}
  .day.on{background:#0f172a; border-color:#0f172a; color:#fff} .day.on .d{color:#cbd5e1}
  .day.today .n{color:var(--brand)} .day.on.today .n{color:#fff}
  .seg{display:flex; background:#eef2f6; border-radius:11px; padding:3px; gap:3px; margin-bottom:11px}
  .seg button{flex:1; border:0; background:none; padding:8px 4px; border-radius:9px; font-size:12.5px;
    font-weight:600; color:var(--muted); cursor:pointer}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(15,23,42,.08)}
  .house-selector{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .house-selector::-webkit-scrollbar{display:none}
  .house-selector button{flex:0 0 auto;min-width:max-content;padding-inline:14px;scroll-snap-align:start}
  .shop-house-picker{margin-bottom:12px;padding:12px;border:1px solid #bfdbfe;border-radius:16px;background:#eff6ff}
  .shop-house-picker-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 2px 9px}
  .shop-house-picker-head b{display:block;color:#1e3a8a;font-size:13px}
  .shop-house-picker-head span{display:block;margin-top:2px;color:#64748b;font-size:10.5px}
  .shop-house-picker .seg{margin-bottom:0;background:#dbeafe}

  /* Μπλοκ ώρας — αντιγράφει τα τρία τμήματα του εντύπου */
  .block{margin-bottom:14px}
  .block-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; padding:0 2px}
  .block-h .t{font-size:13.5px; font-weight:700; letter-spacing:-.01em}
  .block-h .hrs{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .house-h{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin:9px 0 5px 2px}
  .entry{border:1px solid var(--line); border-radius:12px; padding:10px 11px; margin-bottom:0;
    background:#fff; cursor:pointer; display:block; width:100%; text-align:left}
  .entry-wrap{position:relative; margin-bottom:7px}
  .entry-wrap .entry{padding-right:44px}
  .entry-wrap .entry-x{position:absolute; top:6px; right:6px; z-index:2; width:32px; height:32px;
    border-radius:8px; background:rgba(255,255,255,.92); box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .entry.cancelled{opacity:.45; text-decoration:line-through}
  .entry .top{display:flex; gap:8px; align-items:flex-start}
  .entry .emoji{font-size:17px; line-height:1.15; flex:0 0 auto}
  .entry .act{font-size:14px; font-weight:650}
  .entry .meta{font-size:12px; color:var(--muted); margin-top:1px}
  .entry .kids{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
  .avatar{width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    font-size:11px; font-weight:700; color:#0f172a; flex:0 0 auto}
  .empty{text-align:center; color:var(--muted); padding:16px 10px; font-size:12.5px;
    border:1px dashed var(--line); border-radius:12px}

  /* Πίνακας ψυγείου — πλακίδια που τα πατάς ή τα σέρνεις */
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin-bottom:12px}
  .tile{position:relative; background:#fff; border:1px solid var(--line); border-radius:13px;
    padding:11px 6px 9px; text-align:center; cursor:grab; touch-action:none; user-select:none;
    display:flex; flex-direction:column; gap:3px; align-items:center; justify-content:center;
    min-height:62px; transition:transform .1s}
  .tile:active{transform:scale(.95)}
  /* Μεγάλες γερμανικές λέξεις πρέπει να χωρέσουν, όχι να ξεχειλίσουν */
  .tile .nm{font-size:12.5px; font-weight:600; line-height:1.18; max-width:100%;
    overflow-wrap:anywhere; hyphens:auto}
  .tile .st{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .tile .st.low{color:var(--warn); font-weight:700}
  .tile .st.zero{color:#94a3b8}          /* το μηδέν δεν είναι συναγερμός, είναι απλώς άδειο */
  .tile.empty{background:#fafafa}
  .tile.picked{border-color:var(--brand); box-shadow:0 0 0 2px rgba(37,99,235,.18)}
  .tile .badge{position:absolute; top:-7px; right:-7px; min-width:23px; height:23px; padding:0 6px;
    border-radius:999px; background:var(--brand); color:#fff; font-size:12px; font-weight:700;
    display:grid; place-items:center}
  .tile.out .badge{background:var(--out)} .tile.in .badge{background:var(--in)}
  .drops{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px}
  .dropzone{border:2px dashed var(--line); border-radius:14px; padding:15px 8px; text-align:center;
    color:var(--muted); font-size:13px; font-weight:600; transition:all .15s}
  .dropzone.zin.over{border-color:var(--in);  background:#ecfdf5; color:var(--in)}
  .dropzone.zout.over{border-color:var(--out); background:#fef2f2; color:var(--out)}
  .dropzone.zin.filled{border-style:solid; border-color:#6ee7b7; color:var(--in)}
  .dropzone.zout.filled{border-style:solid; border-color:#fca5a5; color:var(--out)}
  /* Fridge board: scrollable list + IN/OUT dock pinned to sheet bottom forever */
  #sheet:has(.stock-board){display:flex;flex-direction:column;padding:12px 0 0;overflow:hidden;
    height:min(94dvh,100%);max-height:min(94dvh,100%)}
  #sheet:has(.stock-board)>.sheet-close{right:12px;top:10px;float:none;position:absolute;z-index:6;
    width:42px;height:42px}
  #sheet:has(.stock-board)>.grabber{margin:0 auto 6px;flex:0 0 auto}
  #sheet:has(.stock-board) .stock-board{padding-top:36px}
  .stock-board{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;padding:0 16px;overflow:hidden}
  .stock-board-scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding-bottom:10px}
  .stock-drops-dock{flex:0 0 auto;margin:0 -16px 0;padding:10px 16px calc(12px + var(--safe-b));
    border-top:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
    box-shadow:0 -10px 28px rgba(15,23,42,.1);position:relative;z-index:4}
  .stock-drops-dock .drops{margin:0;gap:10px}
  .stock-drops-dock .dropzone{padding:18px 8px;font-size:15px;font-weight:800;min-height:64px;display:grid;place-items:center}
  .stock-side-rails{position:fixed;inset:0;z-index:92;pointer-events:none}
  .stock-side-rail{position:absolute;top:18%;bottom:18%;width:54px;display:grid;place-items:center;
    writing-mode:vertical-rl;text-orientation:mixed;font-size:13px;font-weight:850;letter-spacing:.04em;
    pointer-events:none;opacity:.92;border-radius:0 16px 16px 0}
  .stock-side-rail.zin{left:0;background:rgba(5,150,105,.88);color:#ecfdf5;box-shadow:8px 0 24px rgba(5,150,105,.25)}
  .stock-side-rail.zout{right:0;border-radius:16px 0 0 16px;background:rgba(220,38,38,.88);color:#fef2f2;
    box-shadow:-8px 0 24px rgba(220,38,38,.25);writing-mode:vertical-lr}
  .stock-side-rail.over{outline:3px solid #fff;opacity:1;transform:scale(1.02)}
  .stock-toolbar{display:grid;gap:8px;margin:0 0 10px}
  .stock-toolbar-actions{display:flex;gap:6px;flex-wrap:wrap}
  .stock-toolbar-actions .btn{width:auto;margin:0;flex:1;min-width:96px}
  .store-choice{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 8px;
    border-bottom:1px solid #f1f5f9;min-height:40px}
  .store-choice-name{font-size:13.5px;font-weight:750;line-height:1.2}
  .store-choice-qty{font-size:11px;color:#64748b}
  .store-choice-actions{display:flex;gap:4px}
  .store-decision{width:36px;height:36px;border-radius:10px;font-size:15px}
  .store-cat-h{padding:5px 10px;font-size:10.5px}
  .store-scroll{padding:6px 8px calc(14px + var(--dock-h,72px))}
  .cart-qty-input{width:64px;height:38px;padding:4px 5px;border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.cart-qty-input:focus{border-color:#2563eb;background:#eff6ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .stock-quickbar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .stock-quickbar .btn{width:auto;flex:1;min-width:140px;margin:0;min-height:42px}
  .stock-hold-menu{position:fixed;z-index:95;min-width:min(260px,88vw);padding:8px;border-radius:16px;
    background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px rgba(15,23,42,.22)}
  .stock-hold-menu button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;
    background:transparent;padding:12px 12px;border-radius:12px;font-size:14px;font-weight:650;cursor:pointer}
  .stock-hold-menu button:active{background:#f1f5f9}
  .stock-hold-menu .hold-in{color:var(--in)}.stock-hold-menu .hold-out{color:var(--out)}
  .stock-hold-kicker{padding:4px 12px 8px;font-size:11px;color:#64748b;font-weight:700}
  .dirbtn{border:1px solid var(--line); background:#fff; border-radius:9px; width:40px; height:40px;
    font-size:17px; font-weight:700; cursor:pointer; flex:0 0 auto; line-height:1}
  .dirbtn.in{background:#ecfdf5; border-color:#6ee7b7; color:var(--in)}
  .dirbtn.out{background:#fef2f2; border-color:#fca5a5; color:var(--out)}
  .ghost{position:fixed; z-index:90; pointer-events:none; opacity:.9; transform:translate(-50%,-50%) scale(1.05);
    background:#0f172a; color:#fff; padding:8px 12px; border-radius:11px; font-size:13px; font-weight:600}
  .basket-row{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px;
    padding:11px 0; border-bottom:1px solid var(--line)}
  .basket-row:last-child{border-bottom:0}
  .basket-row .grow{min-width:0; overflow-wrap:anywhere}
  .quantity-controls{grid-column:1/-1;display:grid;grid-template-columns:44px 48px minmax(70px,1fr) 48px 44px;
    align-items:center;gap:6px;padding-top:2px}
  .step{width:48px; height:48px; border-radius:12px; border:1px solid var(--line); background:#f8fafc;
    font-size:23px; font-weight:800; cursor:pointer; line-height:1}
  .step:active{background:#e2e8f0}
  .qty-jump{width:44px;height:40px;padding:0 5px;border:1px solid #bfdbfe;border-radius:999px;
    background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
  .qty-jump:active{background:#dbeafe;transform:scale(.97)}
  .qty-input-wrap{position:relative;min-width:0}.qty-input-wrap span{position:absolute;right:10px;top:50%;
    transform:translateY(-50%);color:#64748b;font-size:11px;font-weight:750;pointer-events:none}
  .qty-field{width:100%;height:48px;padding:8px 38px 8px 10px;text-align:center;font-weight:800;
    font-size:17px;border:2px solid #bfdbfe;border-radius:12px;background:#fff;font-variant-numeric:tabular-nums}
  .qty-field:focus{border-color:#2563eb;background:#eff6ff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}

  /* Store mode — μεγάλα κουμπιά για χρήση μέσα στο σουπερμάρκετ */
  .store-row{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:13px 13px; margin-bottom:7px; cursor:pointer; font-size:15px}
  .store-row .tick{width:28px; height:28px; border-radius:8px; border:2px solid var(--line);
    display:grid; place-items:center; font-size:15px; font-weight:700; flex:0 0 auto; color:transparent}
  .store-row.bought{background:#ecfdf5; border-color:#6ee7b7}
  .store-row.bought .tick{background:var(--in); border-color:var(--in); color:#fff}
  .store-row.bought .strong{text-decoration:line-through; opacity:.65}
  .store-row.missing{background:#fef2f2; border-color:#fca5a5}
  .store-row.missing .tick{background:var(--out); border-color:var(--out); color:#fff}

  /* Εβδομαδιαία προβολή — οριζόντια κύλιση, σαν το χαρτί */
  .grid-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:#fff;
    -webkit-overflow-scrolling:touch}
  table.wk{border-collapse:collapse; width:max-content; min-width:100%; font-size:11.5px}
  table.wk th, table.wk td{border:1px solid var(--line); padding:5px 6px; vertical-align:top}
  table.wk th{background:#f8fafc; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); font-weight:700; position:sticky; top:0}
  table.wk td.lbl, table.wk th.lbl{position:sticky; left:0; background:#f8fafc; font-weight:700;
    z-index:1; min-width:74px; font-size:11px}
  table.wk td{min-width:104px; cursor:pointer}
  table.wk td:hover{background:#f8fafc}
  .cellitem{position:relative; margin-bottom:4px; line-height:1.3; padding:5px 26px 5px 6px;
    border-radius:8px; background:#f8fafc; border:1px solid transparent; cursor:pointer}
  .cellitem:hover,.cellitem:focus-visible{border-color:#cbd5e1; background:#fff; outline:none}
  .cellitem b{font-weight:650}
  .cellitem .c{color:#075985}
  .cellitem,.cellitem *{overflow-wrap:anywhere}
  .cellitem-x{position:absolute; top:2px; right:2px; width:22px; height:22px; border:0;
    border-radius:6px; background:transparent; color:#94a3b8; font-size:15px; line-height:1;
    cursor:pointer; padding:0; display:grid; place-items:center}
  .cellitem-x:hover,.cellitem-x:focus-visible{background:#fee2e2; color:#b91c1c; outline:none}

  .planner-filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;
    margin-bottom:13px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
  .filter-label{display:block;font-size:10.5px;font-weight:750;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted);margin:0 0 5px 2px}
  .planner-filters .seg:last-child{margin-bottom:0}

  /* Νέο table system: ένα ενιαίο, responsive matrix αντί για τα παλιά πυκνά tables. */
  .matrix-shell{margin-bottom:14px}
  .matrix-toolbar{display:flex;align-items:center;gap:8px;margin:0 0 7px;flex-wrap:wrap}
  .matrix-toolbar-title{flex:1;min-width:0;font-size:12px;font-weight:800;color:#334155;
    text-transform:uppercase;letter-spacing:.04em}
  .matrix-fs-btn,.matrix-fs-close{width:auto;margin:0;min-height:36px;padding:7px 11px;border:1px solid var(--line);
    border-radius:10px;background:#f8fafc;color:#0f172a;font-size:12px;font-weight:750;cursor:pointer;
    touch-action:manipulation}
  .matrix-fs-btn:active,.matrix-fs-close:active{background:#e2e8f0}
  .matrix-fs-close{background:#0f172a;border-color:#0f172a;color:#fff}
  .matrix{--cols:8; overflow:auto; border:1px solid var(--line); border-radius:16px;
    background:#fff; box-shadow:0 8px 24px rgba(15,23,42,.05); margin-bottom:0;
    scrollbar-width:thin; -webkit-overflow-scrolling:touch; max-height:min(70vh,640px)}
  .matrix-row{display:grid; grid-template-columns:140px repeat(var(--cols),minmax(0,1fr));
    width:100%; min-width:var(--matrix-min,100%); border-bottom:1px solid var(--line); align-items:stretch}
  .matrix-row:last-child{border-bottom:0}

/* Kill stale PWA shells that kept showing the old broken login */
(function(){
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
    }
  } catch (e) {}
})();
